    # ==============================================================================
    # PulseWallet - BASE configuration
    #
    # Shared by every profile. Profile-specific overrides live in:
    #   application-dev.properties   (loose, verbose, convenient)
    #   application-prod.properties  (strict, quiet, env-driven)
    #
    # Every value below can be overridden by an environment variable, which is what
    # makes the same jar deployable to a laptop and to free-tier hosting unchanged.
    # Syntax is ${VAR:default}.
    # ==============================================================================

    spring.application.name=pulsewallet

    # Which profile to run. Override with either:
    #   ./mvnw spring-boot:run -Dspring-boot.run.profiles=prod
    #   SPRING_PROFILES_ACTIVE=prod java -jar target/pulsewallet-0.0.1-SNAPSHOT.jar
    spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

    server.port=${SERVER_PORT:8080}

    # ---- Datasource --------------------------------------------------------------
    # Defaults match docker-compose.yml exactly, so a fresh clone works with no
    # environment setup at all. Do not put real production credentials here.
    spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pulsewallet_db}
    spring.datasource.username=${DB_USERNAME:pulsewallet}
    spring.datasource.password=${DB_PASSWORD:pulsewallet}
    spring.datasource.driver-class-name=org.postgresql.Driver

    # ---- JPA / Hibernate ---------------------------------------------------------
    spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
    # Closes the session at the end of the service call rather than the HTTP
    # response. Prevents accidental lazy-loading in controllers, which is the
    # usual cause of surprise N+1 queries later on.
    spring.jpa.open-in-view=false

    # ---- Jackson -----------------------------------------------------------------
    # Serialise dates as ISO-8601 strings, not epoch numbers, so the React frontend
    # and the Python fraud service both get something predictable.
    spring.jackson.default-property-inclusion=non_null
    spring.jackson.time-zone=UTC

    # ---- CORS (read by config/CorsConfig.java) -----------------------------------
    pulsewallet.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

    # ==============================================================================
    # Reserved for later milestones. Milestone 2 (JWT, Flyway) is active below.
    # ==============================================================================

    # ---- Milestone 2: JWT authentication ----
    # No default for the secret deliberately - a deployment with JWT_SECRET unset
    # should fail to start rather than sign tokens with a guessable value.
    pulsewallet.security.jwt.secret=${JWT_SECRET}
    pulsewallet.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
    # Refresh tokens are not implemented yet - only access-token expiration above
    # is read by JwtService. Left commented so it isn't mistaken for working.
    # pulsewallet.security.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}

    # ---- Milestone 2: Flyway migrations ----
    # spring.jpa.hibernate.ddl-auto=validate in both profiles now that Flyway
    # owns the schema (see application-dev.properties). Letting Hibernate and
    # Flyway both manage the schema is the single most common way this kind of
    # project ends up with a corrupted database.
    spring.flyway.enabled=true
    spring.flyway.locations=classpath:db/migration
    spring.flyway.baseline-on-migrate=true
    spring.flyway.baseline-version=7

    # ---- Milestone 4/5: fraud detection microservice ----
    fraud.api.url=${FRAUD_API_URL:http://127.0.0.1:8000}
    fraud.api.connect-timeout-ms=${FRAUD_API_CONNECT_TIMEOUT_MS:3000}
    fraud.api.read-timeout-ms=${FRAUD_API_READ_TIMEOUT_MS:5000}
    fraud.api.max-retries=${FRAUD_API_MAX_RETRIES:2}
    fraud.api.score-threshold=${FRAUD_SCORE_THRESHOLD:0.5}
