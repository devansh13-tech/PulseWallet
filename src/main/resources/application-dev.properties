# ==============================================================================
# PulseWallet - DEVELOPMENT profile
#
# Active by default. Optimised for fast feedback, not for safety.
# Assumes PostgreSQL is running via: docker compose up -d
# ==============================================================================

# ---- Schema management -------------------------------------------------------
# Flyway migrations (src/main/resources/db/migration) now own the schema.
# Hibernate only checks the entities match what Flyway created - it never
# generates DDL itself. Two tools managing one schema is how databases get
# corrupted, so this must stay `validate`, not `update`, even in dev.
spring.jpa.hibernate.ddl-auto=validate

# ---- SQL visibility ----------------------------------------------------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
# Shows the actual values bound to `?` placeholders - invaluable when a query
# returns nothing and you cannot tell why.
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ---- Logging -----------------------------------------------------------------
logging.level.com.pulsewallet=DEBUG
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr(%-40.40logger{39}){cyan} %msg%n

# ---- Error responses ---------------------------------------------------------
# Full detail locally so you can debug from the HTTP response alone.
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=true

# ---- Readable JSON in curl / browser ----------------------------------------
spring.jackson.serialization.indent-output=true

# ---- Actuator ----------------------------------------------------------------
# Everything exposed - this profile should never run on a public host.
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# ---- DevTools ----------------------------------------------------------------
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ---- Connection pool --------------------------------------------------------
# Small pool, short timeout: fail fast and loudly if Postgres is not up, rather
# than hanging for 30 seconds and leaving you wondering.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.pool-name=PulseWalletDevPool

# Fraud Detection API
fraud.api.url=http://127.0.0.1:8000