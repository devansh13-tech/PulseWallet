# ==============================================================================
# PulseWallet - PRODUCTION profile (Milestone 8 deployment)
#
# Rule for this file: no secrets, no defaults for anything sensitive.
# The variables below have NO fallback on purpose - if the hosting platform
# forgets to set them, the app must refuse to start rather than silently boot
# with development credentials.
#
# Run with:
#   SPRING_PROFILES_ACTIVE=prod java -jar target/pulsewallet-0.0.1-SNAPSHOT.jar
# ==============================================================================

# ---- Datasource (no defaults - fail fast) -----------------------------------
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---- Schema management -------------------------------------------------------
# Never let Hibernate alter a production schema. `validate` only checks that
# the entities match the tables Flyway created, and fails startup if they drift.
spring.jpa.hibernate.ddl-auto=validate

# ---- SQL visibility: off ----------------------------------------------------
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ---- Logging -----------------------------------------------------------------
logging.level.root=WARN
logging.level.com.pulsewallet=INFO
logging.level.org.springframework.web=WARN

# ---- Error responses: leak nothing ------------------------------------------
# Stack traces and exception class names tell an attacker which libraries and
# versions you run. GlobalExceptionHandler returns a safe message instead.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# ---- Compact JSON -----------------------------------------------------------
spring.jackson.serialization.indent-output=false

# ---- Actuator: health and info only -----------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# ---- DevTools off -----------------------------------------------------------
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ---- Connection pool --------------------------------------------------------
# Free-tier Postgres often caps total connections around 20-25. Staying well
# under that leaves room for migrations and any admin session you open.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.pool-name=PulseWalletProdPool

# ---- Graceful shutdown ------------------------------------------------------
# Lets in-flight requests finish when the platform sends SIGTERM on redeploy.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ---- Behind a reverse proxy -------------------------------------------------
# Free-tier hosts terminate TLS upstream; without this the app builds http://
# URLs and sees the proxy IP as the client IP.
server.forward-headers-strategy=framework
