# ==============================================================================
# PulseWallet - Production Multi-Container Orchestration
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# ==============================================================================

services:
  postgres:
    image: postgres:18-alpine
    container_name: pulsewallet-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pulsewallet-pgdata-prod:/var/lib/postgresql/data
    networks:
      - pulsewallet-prod-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  fraud-detection:
    build:
      context: ./fraud-detection
      dockerfile: Dockerfile
    container_name: pulsewallet-fraud-prod
    restart: always
    environment:
      PORT: 8000
      FRAUD_SCORE_THRESHOLD: ${FRAUD_SCORE_THRESHOLD:-0.50}
    networks:
      - pulsewallet-prod-net
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulsewallet-backend-prod
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/${DB_NAME}}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FRAUD_API_URL: http://fraud-detection:8000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      PULSEWALLET_BASE_CURRENCY: ${PULSEWALLET_BASE_CURRENCY:-INR}
      JAVA_OPTS: "-Xmx768m -Xms256m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
    networks:
      - pulsewallet-prod-net
    depends_on:
      postgres:
        condition: service_healthy
      fraud-detection:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulsewallet-frontend-prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - pulsewallet-prod-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  pulsewallet-prod-net:
    name: pulsewallet-prod-net
    driver: bridge

volumes:
  pulsewallet-pgdata-prod:
    name: pulsewallet-pgdata-prod
